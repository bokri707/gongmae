name: daily-update
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Update data
        shell: cmd
        env:
          ONBID_KEY: ${{ secrets.ONBID_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
          PYTHONIOENCODING: utf-8
        run: python update.py
      - name: Save result
        shell: cmd
        run: python save.py
